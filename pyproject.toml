[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-rag"
version = "0.1.0"
description = "Offline-first medical multimodal RAG baseline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "rank-bm25>=0.2.2",
  "pydantic>=2.0",
  "typer>=0.9",
  "rich>=13.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
gpu = [
  "torch>=2.1",
  "transformers>=4.40",
  "accelerate>=0.27",
  "bitsandbytes>=0.43",
  "open_clip_torch>=2.24",
  "qwen-vl-utils>=0.0.8",
  "Pillow>=10.0",
]
qdrant = ["qdrant-client>=1.7"]
agent = ["langgraph>=0.2.28"]
eval = ["ragas>=0.2"]
demo = ["gradio>=4.0"]
all = ["medical-rag[gpu,qdrant,agent,eval,demo]"]

[project.scripts]
medical-rag = "medical_rag.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["medical_rag*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
